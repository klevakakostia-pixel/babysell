<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ROBLOX - Mobile Sunset Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root {
            --glass-bg: rgba(22, 24, 31, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #ff6b81;
            --accent-glow: rgba(255, 107, 129, 0.4);
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; user-select: none; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #0b0c10; color: #fff; overflow: hidden; 
            width: 100vw; height: 100vh; touch-action: none; 
        }

        /* Анімований фон додатку */
        .app-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 0% 0%, #2a1625 0%, #0b0c10 50%),
                        radial-gradient(circle at 100% 100%, #1a1525 0%, #0b0c10 50%);
        }

        .screen { position: absolute; inset: 0; display: none; flex-direction: column; opacity: 0; transition: opacity 0.4s var(--ease); }
        .screen.active { display: flex; opacity: 1; }

        /* Кнопки */
        .glass-btn {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); color: #fff;
            padding: 14px 24px; border-radius: 18px; font-weight: 600; font-size: 15px;
            cursor: pointer; transition: all 0.3s var(--ease);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .glass-btn:active { transform: scale(0.95); }
        
        .glass-btn.primary { background: linear-gradient(135deg, #ff6b81, #ff4757); border: none; }
        .glass-btn.primary:active { box-shadow: 0 0 20px var(--accent-glow); }

        /* --- ЛОГІН --- */
        #login-screen { justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .login-card {
            background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 32px;
            padding: 40px 30px; text-align: center; width: 100%; max-width: 380px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transform: translateY(20px); animation: slideUp 0.6s var(--ease) forwards;
        }
        @keyframes slideUp { to { transform: translateY(0); } }

        /* --- ГОЛОВНЕ МЕНЮ --- */
        #home-screen { z-index: 1000; flex-direction: column; }

        .top-header {
            height: 70px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(11,12,16,0.9), transparent);
            padding-top: env(safe-area-inset-top);
        }
        
        .user-pill {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.05); padding: 5px 15px 5px 5px;
            border-radius: 30px; border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .user-pill img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); }
        .user-pill span { font-size: 13px; font-weight: 600; }

        .dashboard-content {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 30px;
            padding-bottom: 100px; /* Місце для bottom-nav */
        }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-title { font-size: 18px; font-weight: 700; }
        .add-friend-btn { background: rgba(255,255,255,0.1); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .add-friend-btn:active { transform: scale(0.9); background: var(--accent); }

        .friends-row { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 5px; }
        .friends-row::-webkit-scrollbar { display: none; }
        .friend-card { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 65px; }
        .friend-avatar { position: relative; width: 60px; height: 60px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 2px; }
        .friend-avatar img { width: 100%; height: 100%; border-radius: 18px; object-fit: cover; }
        .friend-name { font-size: 11px; color: #a0a5b5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65px; }

        .game-card {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            overflow: hidden; cursor: pointer; position: relative;
            transition: transform 0.2s var(--ease);
        }
        .game-card:active { transform: scale(0.97); }
        .game-thumb { height: 180px; background: linear-gradient(135deg, #ff7b54 0%, #ff4757 100%); display: flex; align-items: center; justify-content: center; position: relative; }
        .online-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; color: #2ed573;
            display: flex; align-items: center; gap: 6px; border: 1px solid rgba(46, 213, 115, 0.3);
        }
        .online-badge::before { content: ''; width: 8px; height: 8px; background: #2ed573; border-radius: 50%; box-shadow: 0 0 8px #2ed573; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .game-info { padding: 18px; }
        .game-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .game-desc { font-size: 13px; color: #a0a5b5; }

        /* Нижнє меню (Bottom Nav) для мобільних */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0; padding-bottom: env(safe-area-inset-bottom, 15px);
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6b6f80; font-size: 10px; width: 60px; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
        .nav-item.active { color: var(--accent); }

        /* --- 3D ГРА --- */
        #game-screen { background: #000; z-index: 3000; }
        .game-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 100; padding: 20px; padding-top: env(safe-area-inset-top); display: flex; justify-content: space-between; align-items: flex-start; }
        .exit-btn { pointer-events: auto; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); padding: 10px 15px; border-radius: 12px; backdrop-filter: blur(10px); color: #fff; display: flex; align-items: center; gap: 6px; font-size: 13px; }
        
        #joystick-zone { position: absolute; bottom: 40px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; backdrop-filter: blur(5px); }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; transition: transform 0.05s linear; }
        
        #jump-btn { position: absolute; bottom: 40px; right: 30px; width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #jump-btn:active { background: rgba(255,255,255,0.3); }
        #jump-btn svg { width: 30px; height: 30px; fill: #fff; }
        
        #touch-camera { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }

        /* Loader */
        #loading-screen { justify-content: center; align-items: center; background: #0b0c10; z-index: 4000; }
        .loader { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-bg"></div>

<!-- 1. ЕКРАН ЛОГІНУ -->
<div id="login-screen" class="screen active">
    <div class="login-card">
        <div style="width: 60px; height: 60px; background: #fff; color: #000; font-size: 32px; font-weight: 900; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; transform: rotate(-10deg);">R</div>
        <h1 style="font-size: 24px; margin-bottom: 10px;">Вхід у систему</h1>
        <p style="color: #a0a5b5; font-size: 14px; margin-bottom: 30px;">Мобільна версія з рідким склом</p>
        <button class="glass-btn primary" onclick="loginWithGoogle()" style="width: 100%;">Увійти через Google</button>
    </div>
</div>

<!-- 2. ГОЛОВНЕ МЕНЮ -->
<div id="home-screen" class="screen">
    <div class="top-header">
        <div class="user-pill">
            <img id="ui-avatar" src="">
            <span id="ui-name">Player</span>
        </div>
        <button class="glass-btn" onclick="logout()" style="padding: 8px 14px; font-size: 12px; background: rgba(255,71,87,0.1); border-color: rgba(255,71,87,0.3); color: #ff6b81;">Вийти</button>
    </div>

    <div class="dashboard-content">
        <!-- Друзі -->
        <div>
            <div class="section-header">
                <div class="section-title">Друзі</div>
                <div class="add-friend-btn" onclick="addRandomFriend()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </div>
            </div>
            <div class="friends-row" id="friends-list">
                <!-- Друзі генеруються через JS -->
            </div>
        </div>

        <!-- Плейси -->
        <div>
            <div class="section-header">
                <div class="section-title">Доступні сервери</div>
            </div>
            <div class="game-card" onclick="joinServer()">
                <div class="game-thumb">
                    <div class="online-badge"><span id="online-count">0</span> Онлайн</div>
                    <div style="font-size: 60px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));">🌅</div>
                </div>
                <div class="game-info">
                    <div class="game-title">Sunset Empty Place</div>
                    <div class="game-desc">Тестовий 3D простір для спілкування. Оптимізовано для смартфонів.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижня навігація -->
    <div class="bottom-nav">
        <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Avatar</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Chat</div>
    </div>
</div>

<!-- 3. ЗАВАНТАЖЕННЯ -->
<div id="loading-screen" class="screen">
    <div class="loader"></div>
    <div style="margin-top: 20px; font-weight: 600;">Вхід на сервер...</div>
</div>

<!-- 4. 3D ГРА -->
<div id="game-screen" class="screen">
    <div class="game-overlay">
        <button class="exit-btn" onclick="leaveGame()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Вийти
        </button>
    </div>
    
    <div id="touch-camera"></div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="jump-btn">
        <svg viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
    </div>
</div>

<script>
    // --- FIREBASE SETUP ---
    const firebaseConfig = { 
        apiKey: "AIzaSyB-vHc4nWntJQwf-Ezd6QH5ChXldCkiYBM", 
        authDomain: "babysell-8b37b.firebaseapp.com", 
        databaseURL: "https://babysell-8b37b-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "babysell-8b37b" 
    };
    firebase.initializeApp(firebaseConfig); 
    const auth = firebase.auth();
    const db = firebase.database();
    
    let currentUser = null;
    let myColor = '#' + Math.floor(Math.random()*16777215).toString(16);
    let isIngame = false;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("Помилка: " + err.message));
    }

    function logout() {
        if(currentUser) {
            db.ref('places/empty/players/' + currentUser.uid).remove();
        }
        auth.signOut().then(() => showScreen('login-screen'));
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('ui-name').innerText = user.displayName.split(' ')[0];
            document.getElementById('ui-avatar').src = user.photoURL;
            showScreen('home-screen');
            
            // Збереження кольору
            db.ref('users/' + user.uid + '/color').once('value', snap => {
                if(!snap.exists()) db.ref('users/' + user.uid + '/color').set(myColor);
                else myColor = snap.val();
            });

            // Підписка на друзів
            db.ref('users/' + user.uid + '/friends').on('value', snap => {
                const list = document.getElementById('friends-list');
                list.innerHTML = '';
                if(snap.exists()) {
                    snap.forEach(child => {
                        const f = child.val();
                        list.innerHTML += `
                            <div class="friend-card">
                                <div class="friend-avatar"><img src="${f.avatar}"></div>
                                <span class="friend-name">${f.name}</span>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = '<div style="color: #8a8d9b; font-size: 13px; padding-top: 10px;">Немає друзів. Додайте першого!</div>';
                }
            });

        } else {
            showScreen('login-screen');
        }
    });

    // Додавання фейкового друга (можна замінити на справжній пошук)
    function addRandomFriend() {
        if(!currentUser) return;
        const names = ["Shadow", "NinjaUA", "ProGamer", "Kitten", "T-Rex", "Ghost"];
        const rndName = names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*99);
        db.ref('users/' + currentUser.uid + '/friends').push({
            name: rndName,
            avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${rndName}`
        });
    }

    // Відслідковування онлайну
    db.ref('places/empty/players').on('value', snap => {
        document.getElementById('online-count').innerText = snap.numChildren() || 0;
    });

    // --- ЛОГІКА ВХОДУ/ВИХОДУ З 3D ---
    function joinServer() {
        showScreen('loading-screen');
        setTimeout(() => {
            isIngame = true;
            showScreen('game-screen');
            if(!scene) init3DGame();
            
            // Фікс: Скидання позиції при заході (падіння з неба)
            if(playerGroup) {
                playerGroup.position.set(0, 15, 0);
                playerGroup.rotation.y = 0;
                velocityY = 0;
                cameraYaw = 0;
                cameraPitch = 0.3;
            }
        }, 800);
    }

    function leaveGame() {
        isIngame = false;
        if(currentUser) {
            // Негайне видалення з сервера
            db.ref('places/empty/players/' + currentUser.uid).remove();
        }
        showScreen('home-screen');
    }

    // --- THREE.JS ENGINE (SUNSET MAP) ---
    let scene, camera, renderer, playerObj, playerGroup;
    let otherPlayers = {};
    let joyMove = { x: 0, y: 0 };
    let cameraYaw = 0, cameraPitch = 0.3, isJump = false;
    let velocityY = 0, gravity = -0.015, moveSpeed = 0.25;

    function createRobloxAvatar(colorHex, nameText) {
        const group = new THREE.Group();
        const mat = new THREE.MeshLambertMaterial({ color: colorHex });
        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2, 0.8), mat); torso.position.y = 2; torso.castShadow = true; group.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), skinMat); head.position.y = 3.6; head.castShadow = true; group.add(head);
        
        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2, 0.7), mat); leftArm.position.set(-1.2, 2, 0); group.add(leftArm);
        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2, 0.7), mat); rightArm.position.set(1.2, 2, 0); group.add(rightArm);
        const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.75, 2, 0.75), mat); leftLeg.position.set(-0.45, 0, 0); group.add(leftLeg);
        const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.75, 2, 0.75), mat); rightLeg.position.set(0.45, 0, 0); group.add(rightLeg);

        // NameTag
        const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.roundRect(10, 10, 236, 44, 20); ctx.fill();
        ctx.font = "bold 26px Arial"; ctx.fillStyle = "#ffffff"; ctx.textAlign = "center"; ctx.fillText(nameText, 128, 42);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
        sprite.scale.set(4, 1, 1); sprite.position.y = 5; group.add(sprite);

        return {
            group: group, lA: leftArm, rA: rightArm, lL: leftLeg, rL: rightLeg,
            anim: function(time, isMove) {
                const a = isMove ? Math.sin(time * 12) * 0.7 : 0;
                this.lA.rotation.x = THREE.MathUtils.lerp(this.lA.rotation.x, a, 0.2);
                this.rA.rotation.x = THREE.MathUtils.lerp(this.rA.rotation.x, -a, 0.2);
                this.lL.rotation.x = THREE.MathUtils.lerp(this.lL.rotation.x, -a, 0.2);
                this.rL.rotation.x = THREE.MathUtils.lerp(this.rL.rotation.x, a, 0.2);
            }
        };
    }

    function init3DGame() {
        const container = document.getElementById('game-screen');
        scene = new THREE.Scene();
        
        // SUNSET AESTHETICS
        scene.background = new THREE.Color(0xff8c69); // Захід сонця
        scene.fog = new THREE.FogExp2(0xff8c69, 0.015);

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.insertBefore(renderer.domElement, container.firstChild);

        // Освітлення
        scene.add(new THREE.AmbientLight(0x504060, 0.8)); // М'яке фіолетове світло
        const dirLight = new THREE.DirectionalLight(0xffd27f, 1.2); // Тепле сонячне світло
        dirLight.position.set(-40, 20, -50); 
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Візуальне сонце
        const sun = new THREE.Mesh(new THREE.SphereGeometry(15, 32, 32), new THREE.MeshBasicMaterial({color: 0xffd700, fog: false}));
        sun.position.set(-80, 40, -100);
        scene.add(sun);

        // Земля
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x2a1a1f }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
        scene.add(ground);

        // Сітка (стиль)
        const grid = new THREE.GridHelper(400, 80, 0xff6b81, 0xff6b81);
        grid.material.opacity = 0.1; grid.material.transparent = true;
        scene.add(grid);

        playerObj = createRobloxAvatar(myColor, currentUser.displayName.split(' ')[0]);
        playerGroup = playerObj.group;
        scene.add(playerGroup);

        setupMobileControls();
        
        // Синхронізація Firebase
        const myRef = db.ref('places/empty/players/' + currentUser.uid);
        myRef.onDisconnect().remove();

        setInterval(() => {
            if(!isIngame) return; // Не відправляти дані, якщо вийшли
            const isM = (joyMove.x !== 0 || joyMove.y !== 0);
            myRef.set({ x: playerGroup.position.x, y: playerGroup.position.y, z: playerGroup.position.z, ry: playerGroup.rotation.y, name: currentUser.displayName.split(' ')[0], color: myColor, isM: isM });
        }, 80);

        db.ref('places/empty/players').on('value', snap => {
            const players = snap.val() || {};
            for(let uid in players) {
                if(uid === currentUser.uid) continue;
                const d = players[uid];
                if(!otherPlayers[uid]) {
                    const avatar = createRobloxAvatar(d.color || '#fff', d.name);
                    scene.add(avatar.group);
                    otherPlayers[uid] = { avatar: avatar, tx: d.x, ty: d.y, tz: d.z, try: d.ry, isM: false };
                }
                const op = otherPlayers[uid];
                op.tx = d.x; op.ty = d.y; op.tz = d.z; op.try = d.ry; op.isM = d.isM;
            }
            for(let uid in otherPlayers) {
                if(!players[uid]) { scene.remove(otherPlayers[uid].avatar.group); delete otherPlayers[uid]; }
            }
        });

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        
        animate();
    }

    function setupMobileControls() {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let jId = null, cx, cy;

        zone.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; jId = t.identifier; const r = zone.getBoundingClientRect(); cx = r.left + r.width/2; cy = r.top + r.height/2; updateJ(t); });
        zone.addEventListener('touchmove', e => { e.preventDefault(); for(let t of e.changedTouches) if(t.identifier === jId) updateJ(t); });
        const resetJ = (e) => { for(let t of e.changedTouches) if(t.identifier === jId) { jId = null; knob.style.transform = `translate(0,0)`; joyMove = {x:0, y:0}; } };
        zone.addEventListener('touchend', resetJ); zone.addEventListener('touchcancel', resetJ);

        function updateJ(t) {
            let dx = t.clientX - cx, dy = t.clientY - cy;
            const dist = Math.sqrt(dx*dx + dy*dy), maxR = 35;
            if(dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyMove.x = dx / maxR; joyMove.y = dy / maxR;
        }

        const camZone = document.getElementById('touch-camera');
        let cId = null, lx, ly;
        camZone.addEventListener('touchstart', e => { const t = e.changedTouches[0]; cId = t.identifier; lx = t.clientX; ly = t.clientY; });
        camZone.addEventListener('touchmove', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === cId) {
                    cameraYaw -= (t.clientX - lx) * 0.008;
                    cameraPitch = Math.max(0.05, Math.min(1.4, cameraPitch + (t.clientY - ly) * 0.008));
                    lx = t.clientX; ly = t.clientY;
                }
            }
        });

        const btnJump = document.getElementById('jump-btn');
        btnJump.addEventListener('touchstart', e => { e.preventDefault(); isJump = true; });
        btnJump.addEventListener('touchend', e => { e.preventDefault(); isJump = false; });
    }

    function animate(time) {
        requestAnimationFrame(animate);
        if(!isIngame) return; // Зупинити розрахунки, якщо в меню

        const isMoving = (joyMove.x !== 0 || joyMove.y !== 0);

        if(isMoving) {
            const angle = Math.atan2(joyMove.x, joyMove.y) + cameraYaw;
            playerGroup.position.x += Math.sin(angle) * moveSpeed;
            playerGroup.position.z += Math.cos(angle) * moveSpeed;
            playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, angle, 0.3);
        }

        // Гравітація та стрибок
        velocityY += gravity; 
        playerGroup.position.y += velocityY;
        if(playerGroup.position.y <= 1) {
            playerGroup.position.y = 1; velocityY = 0;
            if(isJump) { velocityY = 0.35; isJump = false; }
        }

        playerObj.anim(time * 0.001, isMoving);

        // Інші гравці
        for(let uid in otherPlayers) {
            const op = otherPlayers[uid];
            op.avatar.group.position.lerp(new THREE.Vector3(op.tx, op.ty, op.tz), 0.2);
            op.avatar.group.rotation.y = THREE.MathUtils.lerp(op.avatar.group.rotation.y, op.try, 0.2);
            op.avatar.anim(time * 0.001, op.isM);
        }

        // Камера
        const camDist = 12;
        const tx = playerGroup.position.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * camDist;
        const ty = playerGroup.position.y + Math.sin(cameraPitch) * camDist + 1;
        const tz = playerGroup.position.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * camDist;
        camera.position.lerp(new THREE.Vector3(tx, ty, tz), 0.15);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

        renderer.render(scene, camera);
    }
</script>
