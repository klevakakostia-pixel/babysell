<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BABYSELL ROBLOX</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- Three.js (Для 3D графіки) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        :root { --main: #ff9d00; --bg: #050212; --ease-hyper: cubic-bezier(0.15, 0.85, 0.25, 1); }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; user-select: none; }
        body { background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; }
        
        /* Задній фон для меню */
        .sunset-bg-container { position: fixed; inset: 0; z-index: -1; background: linear-gradient(to bottom, #040110 0%, #110624 45%, #25092b 80%, #1f1105 100%); }
        .sunset-sun { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 240px; height: 240px; background: radial-gradient(circle, #ffb700 15%, #ff4500 100%); border-radius: 50%; box-shadow: 0 0 60px rgba(255, 69, 0, 0.5), 0 0 150px rgba(255, 183, 0, 0.2); animation: sunPulse 8s ease-in-out infinite alternate; }
        @keyframes sunPulse { from { transform: translate(-50%, -50%) scale(0.97); opacity: 0.85; } to { transform: translate(-50%, -50%) scale(1.03); opacity: 1; } }
        
        /* Кнопки */
        .btn-nav { position: relative; z-index: 1; overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 25px; border-radius: 30px; font-family: 'Orbitron'; font-size: 14px; letter-spacing: 2px; cursor: pointer; transition: 0.5s var(--ease-hyper); backdrop-filter: blur(5px); }
        .btn-nav::before { content: ""; position: absolute; top: 100%; left: 50%; width: 400px; height: 400px; margin-left: -200px; background: var(--main); border-radius: 40%; z-index: -1; transition: top 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-nav:hover::before { top: -100px; animation: btnWaveAnim 5s linear infinite; }
        .btn-nav:hover { color: #000; border-color: var(--main); box-shadow: 0 0 20px rgba(255,157,0,0.4); }
        @keyframes btnWaveAnim { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Екрани */
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
        .screen.active { display: flex; }

        /* Екран Логіну */
        #login-screen { justify-content: center; align-items: center; z-index: 2000; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        
        /* Головне меню (Roblox Style) */
        #home-screen { z-index: 1000; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 80px; background: rgba(0, 0, 0, 0.8); border-bottom: 1px solid rgba(255,157,0,0.2); }
        .places-grid { display: flex; padding: 40px; gap: 30px; flex-wrap: wrap; justify-content: center; overflow-y: auto; }
        .place-card { background: rgba(10, 5, 20, 0.8); border: 1px solid rgba(255,157,0,0.2); border-radius: 20px; width: 300px; padding: 20px; text-align: center; transition: 0.3s; cursor: pointer; }
        .place-card:hover { transform: translateY(-10px); border-color: var(--main); box-shadow: 0 10px 30px rgba(255,157,0,0.2); }
        .place-thumbnail { width: 100%; height: 150px; background: #111; border-radius: 10px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; color: #444; font-size: 24px; border: 1px dashed #333; }
        
        /* Екран завантаження */
        #loading-screen { justify-content: center; align-items: center; background: #000; z-index: 3000; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,157,0,0.3); border-top-color: var(--main); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Гра (3D) */
        #game-screen { background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Мобільний джойстик */
        #joystick-zone { display: none; position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 100; border: 2px solid rgba(255,157,0,0.3); }
        #joystick-knob { position: absolute; top: 50px; left: 50px; width: 50px; height: 50px; background: var(--main); border-radius: 50%; box-shadow: 0 0 15px var(--main); pointer-events: none; }
        
        #mobile-jump { display: none; position: absolute; bottom: 50px; right: 50px; width: 70px; height: 70px; background: rgba(255,157,0,0.2); border: 2px solid var(--main); border-radius: 50%; color: #fff; font-family: 'Orbitron'; font-weight: bold; z-index: 100; align-items: center; justify-content: center; }

        @media (max-width: 768px) {
            #joystick-zone, #mobile-jump { display: flex; }
            .header { padding: 0 20px; }
        }
    </style>
</head>
<body>

<!-- Задній фон меню -->
<div class="sunset-bg-container" id="menu-bg">
    <div class="sunset-sun"></div>
</div>

<!-- 1. Екран Входу -->
<div id="login-screen" class="screen active">
    <h1 style="font-family:'Orbitron'; font-size:40px; margin-bottom:10px; color:var(--main);">BABYSELL WORLD</h1>
    <p style="margin-bottom: 40px; color:#aaa;">Log in to access places</p>
    <button class="btn-nav" onclick="loginWithGoogle()" style="font-size: 18px; padding: 15px 40px;">LOGIN WITH GOOGLE</button>
</div>

<!-- 2. Головне Меню (Roblox Style) -->
<div id="home-screen" class="screen">
    <div class="header">
        <div style="font-family:'Orbitron'; font-size:24px; color:var(--main); font-weight:900;">BABYSELL</div>
        <div style="display:flex; align-items:center; gap:15px;">
            <div style="text-align: right;">
                <div id="ui-name" style="font-weight:bold; font-size:16px;">Player</div>
                <div id="ui-bal" style="color:var(--main); font-family:'Orbitron'; font-size:14px;">0 B-Coins</div>
            </div>
            <img id="ui-avatar" src="" style="width:45px; height:45px; border-radius:50%; border:2px solid var(--main);">
        </div>
    </div>
    
    <div class="places-grid">
        <div class="place-card">
            <div class="place-thumbnail">EMPTY</div>
            <h2 style="font-family:'Orbitron'; margin-bottom:10px;">Empty Place</h2>
            <p style="color:#888; font-size:14px; margin-bottom:20px;">A blank canvas. Run around and meet other players.</p>
            <button class="btn-nav" style="width:100%; background:var(--main); color:#000;" onclick="joinServer()">PLAY</button>
        </div>
    </div>
</div>

<!-- 3. Екран завантаження -->
<div id="loading-screen" class="screen">
    <div class="spinner"></div>
    <h2 id="loading-text" style="font-family:'Orbitron'; color:var(--main); letter-spacing:3px;">CONNECTING TO SERVER...</h2>
</div>

<!-- 4. Гра (3D) -->
<div id="game-screen" class="screen">
    <!-- Сюди Three.js вставить canvas -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="mobile-jump">JUMP</div>
</div>

<script>
    // --- FIREBASE SETUP ---
    const firebaseConfig = { 
        apiKey: "AIzaSyB-vHc4nWntJQwf-Ezd6QH5ChXldCkiYBM", 
        authDomain: "babysell-8b37b.firebaseapp.com", 
        databaseURL: "https://babysell-8b37b-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "babysell-8b37b", 
        appId: "1:955498378146:web:52f027f8e97398e75b78fb" 
    };
    firebase.initializeApp(firebaseConfig); 
    const auth = firebase.auth();
    const db = firebase.database();
    
    let currentUser = null;
    let myColor = '#' + Math.floor(Math.random()*16777215).toString(16); // Випадковий колір кубика

    // --- UI ЛОГІКА ---
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("Login failed: " + err.message));
    }

    // Слухач авторизації
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('ui-name').innerText = user.displayName || "Guest";
            document.getElementById('ui-avatar').src = user.photoURL;
            showScreen('home-screen');
            
            // Створюємо профіль у базі, якщо немає
            db.ref('users/' + user.uid).once('value', snap => {
                if(!snap.exists()) {
                    db.ref('users/' + user.uid).set({ name: user.displayName, balance: 0, color: myColor });
                } else {
                    myColor = snap.val().color || myColor;
                    document.getElementById('ui-bal').innerText = (snap.val().balance || 0) + " B-Coins";
                }
            });
        } else {
            showScreen('login-screen');
        }
    });

    // Підключення до сервера (плейсу)
    function joinServer() {
        showScreen('loading-screen');
        document.getElementById('menu-bg').style.display = 'none'; // Ховаємо задній фон заходу сонця
        
        // Імітуємо реальне підключення для атмосфери
        setTimeout(() => { document.getElementById('loading-text').innerText = "JOINING INSTANCE..."; }, 1000);
        setTimeout(() => { document.getElementById('loading-text').innerText = "REQUESTING CHARACTER..."; }, 2000);
        
        setTimeout(() => {
            showScreen('game-screen');
            init3DGame(); // Запускаємо Three.js
        }, 3000);
    }

    // --- 3D ГРА (THREE.JS) ---
    let scene, camera, renderer;
    let player, playerMesh;
    let otherPlayers = {}; // Об'єкти інших гравців на карті
    let keys = { w:false, a:false, s:false, d:false, space:false };
    let joyMove = { x: 0, y: 0 };
    
    function init3DGame() {
        const gameDiv = document.getElementById('game-screen');
        
        // 1. Сцена та Туман (щоб край карти розчинявся)
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Блакитне небо
        scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

        // 2. Камера (від 3-го лиця)
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // 3. Рендерер
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        gameDiv.appendChild(renderer.domElement);

        // 4. Світло
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 5. Земля (Карта)
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a5a22 }); // Трава
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Сітка на землі (для стилю Roblox Baseplate)
        const grid = new THREE.GridHelper(500, 100, 0x000000, 0x000000);
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);

        // 6. МІЙ ПЕРСОНАЖ (Роблокс-стайл кубик)
        player = new THREE.Group();
        
        const geo = new THREE.BoxGeometry(2, 4, 2);
        const mat = new THREE.MeshLambertMaterial({ color: myColor });
        playerMesh = new THREE.Mesh(geo, mat);
        playerMesh.position.y = 2; // Піднімаємо над землею
        playerMesh.castShadow = true;
        player.add(playerMesh);
        
        // Додаємо нікнейм над собою
        const nameTag = createNameTag(currentUser.displayName);
        nameTag.position.y = 5;
        player.add(nameTag);

        scene.add(player);

        // 7. Керування ПК (WASD)
        window.addEventListener('keydown', e => {
            if(e.key.toLowerCase() === 'w' || e.key === 'ц') keys.w = true;
            if(e.key.toLowerCase() === 's' || e.key === 'і') keys.s = true;
            if(e.key.toLowerCase() === 'a' || e.key === 'ф') keys.a = true;
            if(e.key.toLowerCase() === 'd' || e.key === 'в') keys.d = true;
            if(e.key === ' ') keys.space = true;
        });
        window.addEventListener('keyup', e => {
            if(e.key.toLowerCase() === 'w' || e.key === 'ц') keys.w = false;
            if(e.key.toLowerCase() === 's' || e.key === 'і') keys.s = false;
            if(e.key.toLowerCase() === 'a' || e.key === 'ф') keys.a = false;
            if(e.key.toLowerCase() === 'd' || e.key === 'в') keys.d = false;
            if(e.key === ' ') keys.space = false;
        });

        // 8. Керування Телефон (Джойстик)
        setupJoystick();

        // 9. Ресайз екрану
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 10. Мережа: Firebase Sync
        setupMultiplayer();

        // Запуск ігрового циклу
        animate();
    }

    // Створення тексту над головою (Sprite)
    function createNameTag(text) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, 256, 64);
        ctx.font = "bold 30px Arial";
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.fillText(text, 128, 40);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(6, 1.5, 1);
        return sprite;
    }

    // Мобільний джойстик
    function setupJoystick() {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        const jumpBtn = document.getElementById('mobile-jump');
        
        let isDragging = false;
        let centerX, centerY;

        zone.addEventListener('touchstart', e => {
            isDragging = true;
            const rect = zone.getBoundingClientRect();
            centerX = rect.left + rect.width / 2;
            centerY = rect.top + rect.height / 2;
            handleTouch(e);
        });

        zone.addEventListener('touchmove', e => {
            if(isDragging) handleTouch(e);
        });

        zone.addEventListener('touchend', () => {
            isDragging = false;
            knob.style.transform = `translate(0px, 0px)`;
            joyMove = { x: 0, y: 0 };
        });

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            
            // Обмеження радіусу джойстика
            const distance = Math.sqrt(dx*dx + dy*dy);
            const maxRadius = 50;
            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }
            
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            // Нормалізуємо для швидкості (-1 до 1)
            joyMove.x = dx / maxRadius;
            joyMove.y = dy / maxRadius;
        }

        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; });
        jumpBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });
    }

    // Мережевий код (Мультиплеєр)
    let lastSync = 0;
    function setupMultiplayer() {
        const myRef = db.ref('places/empty/players/' + currentUser.uid);
        
        // Видаляти нас із сервера при закритті вкладки
        myRef.onDisconnect().remove();

        // Синхронізуємо свої координати
        setInterval(() => {
            myRef.set({
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                ry: player.rotation.y,
                name: currentUser.displayName,
                color: myColor
            });
        }, 100); // 10 разів на секунду

        // Слухаємо інших гравців
        db.ref('places/empty/players').on('value', snap => {
            const serverPlayers = snap.val() || {};
            
            // Оновлюємо або створюємо
            for(let uid in serverPlayers) {
                if(uid === currentUser.uid) continue; // Себе ігноруємо
                
                const data = serverPlayers[uid];
                if(!otherPlayers[uid]) {
                    // Створюємо нового гравця
                    const group = new THREE.Group();
                    const pMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(2, 4, 2),
                        new THREE.MeshLambertMaterial({ color: data.color || '#fff' })
                    );
                    pMesh.position.y = 2;
                    pMesh.castShadow = true;
                    group.add(pMesh);
                    
                    const pTag = createNameTag(data.name);
                    pTag.position.y = 5;
                    group.add(pTag);

                    scene.add(group);
                    otherPlayers[uid] = group;
                }
                
                // Плавне переміщення (Lerp можна додати пізніше, поки жорстко)
                otherPlayers[uid].position.set(data.x, data.y, data.z);
                otherPlayers[uid].rotation.y = data.ry;
            }

            // Видаляємо тих, хто вийшов
            for(let uid in otherPlayers) {
                if(!serverPlayers[uid]) {
                    scene.remove(otherPlayers[uid]);
                    delete otherPlayers[uid];
                }
            }
        });
    }

    // Фізика та ігровий цикл
    let velocityY = 0;
    const speed = 0.3;
    const gravity = -0.02;

    function animate() {
        requestAnimationFrame(animate);

        // 1. Рух гравця (ПК + Телефон)
        let moveX = 0;
        let moveZ = 0;

        // WASD
        if(keys.w) moveZ -= speed;
        if(keys.s) moveZ += speed;
        if(keys.a) moveX -= speed;
        if(keys.d) moveX += speed;

        // Джойстик
        if(joyMove.x !== 0 || joyMove.y !== 0) {
            moveX = joyMove.x * speed;
            moveZ = joyMove.y * speed;
        }

        player.position.x += moveX;
        player.position.z += moveZ;

        // Поворот персонажа в сторону руху
        if(moveX !== 0 || moveZ !== 0) {
            player.rotation.y = Math.atan2(moveX, moveZ);
        }

        // 2. Стрибок і гравітація
        velocityY += gravity;
        player.position.y += velocityY;
        
        if (player.position.y <= 0) {
            player.position.y = 0;
            velocityY = 0;
            if (keys.space) {
                velocityY = 0.5; // Сила стрибка
            }
        }

        // 3. Камера від 3-го лиця (слідує за гравцем)
        // Висить трохи позаду і зверху
        camera.position.x = player.position.x;
        camera.position.y = player.position.y + 10; // Висота камери
        camera.position.z = player.position.z + 20; // Відстань назад
        
        camera.lookAt(player.position); // Камера завжди дивиться на гравця

        renderer.render(scene, camera);
    }
</script>

</body>
</html>
