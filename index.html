<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BABYSELL WORLD 1.0</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        :root { --main: #ff9d00; --bg: #050212; --ease-hyper: cubic-bezier(0.15, 0.85, 0.25, 1); }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; user-select: none; }
        body { background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; overflow: hidden; position: relative; height: 100vh; touch-action: none; }
        
        /* Background Animations */
        .sunset-bg-container { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(to bottom, #040110 0%, #110624 45%, #25092b 80%, #1f1105 100%); }
        .sunset-sun { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 240px; height: 240px; background: radial-gradient(circle, #ffb700 15%, #ff4500 100%); border-radius: 50%; box-shadow: 0 0 60px rgba(255, 69, 0, 0.5), 0 0 150px rgba(255, 183, 0, 0.2); animation: sunPulse 8s ease-in-out infinite alternate; }
        @keyframes sunPulse { from { transform: translate(-50%, -50%) scale(0.97); opacity: 0.85; } to { transform: translate(-50%, -50%) scale(1.03); opacity: 1; } }
        .waves { position: absolute; bottom: 0; left: 0; width: 100%; height: 15vh; min-height: 100px; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }
        
        /* Welcome Screen */
        #welcome-screen { position: fixed; inset: 0; background: #000; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 2.5s var(--ease-hyper), visibility 2.5s; }
        .welcome-logo { font-family: 'Orbitron'; font-size: 60px; font-weight: 900; letter-spacing: 20px; text-shadow: 0 0 50px var(--main); animation: softGlow 4s infinite alternate; text-align: center;}
        @keyframes softGlow { from { opacity: 0.3; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        /* Main UI */
        .app-content { opacity: 0; filter: blur(20px); transform: scale(1.05); transition: all 2.5s var(--ease-hyper); z-index: 10; position: absolute; inset: 0; display: flex; flex-direction: column; }
        .app-loaded .app-content { opacity: 1; filter: blur(0); transform: scale(1); }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 80px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,157,0,0.15); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 100; }
        
        .btn-nav { position: relative; z-index: 1; overflow: hidden; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); color: #ccc; padding: 10px 20px; border-radius: 30px; font-family: 'Orbitron'; font-size: 10px; letter-spacing: 2px; cursor: pointer; transition: 0.5s var(--ease-hyper); }
        .btn-nav::before { content: ""; position: absolute; top: 100%; left: 50%; width: 400px; height: 400px; margin-left: -200px; background: var(--main); border-radius: 40%; z-index: -1; transition: top 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-nav:hover:not(:disabled)::before { top: -100px; animation: btnWaveAnim 5s linear infinite; }
        .btn-nav:hover:not(:disabled) { color: #000; border-color: var(--main); box-shadow: 0 0 20px rgba(255,157,0,0.4); }
        @keyframes btnWaveAnim { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Game Area */
        #game-container { flex-grow: 1; position: relative; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; background: transparent; }
        
        /* Mobile Controls (D-Pad) */
        #mobile-controls { display: none; position: absolute; bottom: 40px; left: 40px; width: 150px; height: 150px; z-index: 50; }
        .dpad-btn { position: absolute; width: 50px; height: 50px; background: rgba(255, 157, 0, 0.15); border: 1px solid rgba(255, 157, 0, 0.4); border-radius: 50%; color: var(--main); font-family: 'Orbitron'; font-size: 20px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .dpad-btn:active { background: rgba(255, 157, 0, 0.5); color: #000; box-shadow: 0 0 15px var(--main); }
        #btn-up { top: 0; left: 50px; }
        #btn-down { bottom: 0; left: 50px; }
        #btn-left { top: 50px; left: 0; }
        #btn-right { top: 50px; left: 100px; }

        @media (max-width: 768px) {
            #mobile-controls { display: block; } /* Показуємо на телефонах */
            .header { padding: 0 15px; }
            .hide-mobile { display: none !important; }
            .welcome-logo { font-size: 40px; letter-spacing: 10px; }
        }
    </style>
</head>
<body>

<div class="sunset-bg-container">
    <div class="sunset-sun"></div>
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none">
        <defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" /></defs>
        <g class="parallax">
            <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255, 69, 0, 0.6)" />
            <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(211, 46, 230, 0.4)" />
            <use xlink:href="#gentle-wave" x="48" y="7" fill="#050212" />
        </g>
    </svg>
</div>

<div id="welcome-screen">
    <div class="welcome-logo">BABYSELL WORLD</div>
    <button class="btn-nav" style="margin-top:50px; padding:20px 60px;" onclick="initApp()">ENTER WORLD</button>
</div>

<audio id="bg-music" loop><source src="https://files.catbox.moe/5ru7vf.mp3"></audio>

<div class="app-content">
    <header class="header">
        <div style="font-family:Orbitron; letter-spacing:5px; font-weight:900; color:var(--main);">BABYSELL MMO</div>
        
        <div style="display:flex; align-items:center; gap:20px;">
            <div style="text-align: right; line-height: 1.2;">
                <div id="u-bal" style="color:var(--main); font-family:Orbitron; font-size:18px; font-weight:900;">0 B</div>
                <div id="u-lvl" style="color:#aaa; font-size:12px;">LVL: 1</div>
            </div>
            <button id="l-btn" class="btn-nav" onclick="login()">LOGIN TO PLAY</button>
            <div id="l-prof" style="display:none; position: relative;">
                <img id="l-ava" src="" style="width:40px; height:40px; border-radius:50%; border:2px solid var(--main); object-fit: cover;">
            </div>
        </div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Джойстик для телефонів -->
        <div id="mobile-controls">
            <div class="dpad-btn" id="btn-up">W</div>
            <div class="dpad-btn" id="btn-down">S</div>
            <div class="dpad-btn" id="btn-left">A</div>
            <div class="dpad-btn" id="btn-right">D</div>
        </div>
    </div>
</div>

<script>
    const music = document.getElementById('bg-music');
    function initApp() { 
        music.volume = 0.2; 
        music.play().catch(e => console.log("Audio play prevented")); 
        document.getElementById('welcome-screen').style.opacity = '0'; 
        setTimeout(() => { 
            document.getElementById('welcome-screen').style.visibility = 'hidden'; 
            document.body.classList.add('app-loaded'); 
            initGame(); // Запуск гри після екрану завантаження
        }, 1500); 
    }

    const firebaseConfig = { 
        apiKey: "AIzaSyB-vHc4nWntJQwf-Ezd6QH5ChXldCkiYBM", 
        authDomain: "babysell-8b37b.firebaseapp.com", 
        databaseURL: "https://babysell-8b37b-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "babysell-8b37b", 
        appId: "1:955498378146:web:52f027f8e97398e75b78fb" 
    };
    firebase.initializeApp(firebaseConfig); 
    const auth = firebase.auth(), db = firebase.database();
    
    let user = null;
    let myData = { x: Math.random()*1000 - 500, y: Math.random()*1000 - 500, balance: 0, level: 1, name: "Guest", color: getRandomColor() };
    let otherPlayers = {};
    let crystals = {}; // Лут на карті
    
    // Вхід через Google
    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    
    auth.onAuthStateChanged(u => { 
        if(u) { 
            user = u; 
            document.getElementById('l-btn').style.display = 'none'; 
            document.getElementById('l-prof').style.display = 'block'; 
            document.getElementById('l-ava').src = u.photoURL; 
            myData.name = u.displayName || "Player";

            const userRef = db.ref('users/' + u.uid);
            userRef.once('value').then(snap => {
                if(snap.exists()) {
                    let d = snap.val();
                    myData.balance = d.balance || 0;
                    myData.level = d.level || 1;
                    if(d.x) myData.x = d.x;
                    if(d.y) myData.y = d.y;
                    if(d.color) myData.color = d.color;
                } else {
                    userRef.set(myData);
                }
                updateUI();
            });

            // Слухаємо свій баланс
            userRef.child('balance').on('value', s => { myData.balance = s.val() || 0; updateUI(); checkLevelUp(); });
            userRef.child('level').on('value', s => { myData.level = s.val() || 1; updateUI(); });
            
            // Запускаємо синхронізацію мережі
            startNetworkSync();
        } 
    });

    function updateUI() {
        document.getElementById('u-bal').innerText = myData.balance.toLocaleString() + " B";
        document.getElementById('u-lvl').innerText = "LVL: " + myData.level;
    }

    function checkLevelUp() {
        let neededForNext = myData.level * 100; // Кожні 100 коїнів новий рівень
        if (myData.balance >= neededForNext) {
            myData.level++;
            db.ref('users/' + user.uid + '/level').set(myData.level);
        }
    }

    // --- GAME ENGINE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let keys = {};

    window.addEventListener('resize', () => { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; });

    // Управління ПК
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Управління Телефон
    const bindTouch = (id, key) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
    };
    bindTouch('btn-up', 'w'); bindTouch('btn-down', 's'); bindTouch('btn-left', 'a'); bindTouch('btn-right', 'd');

    function getRandomColor() {
        const colors = ['#ff9d00', '#ff4500', '#d32ee6', '#4b69ff', '#00ffaa'];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    function initGame() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        updatePhysics();
        drawScene();
        requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
        if(!user) return; // Чекаємо логіна для руху
        
        let speed = 4 + (myData.level * 0.2); // Швидкість росте з рівнем
        let moved = false;

        if (keys['w'] || keys['ц']) { myData.y -= speed; moved = true; }
        if (keys['s'] || keys['і']) { myData.y += speed; moved = true; }
        if (keys['a'] || keys['ф']) { myData.x -= speed; moved = true; }
        if (keys['d'] || keys['в']) { myData.x += speed; moved = true; }

        // Межі карти (наприклад від -2000 до 2000)
        myData.x = Math.max(-2000, Math.min(2000, myData.x));
        myData.y = Math.max(-2000, Math.min(2000, myData.y));

        // Збір кристалів (Collision)
        let playerSize = 20 + (myData.level * 2);
        for(let id in crystals) {
            let c = crystals[id];
            let dx = myData.x - c.x;
            let dy = myData.y - c.y;
            if(Math.sqrt(dx*dx + dy*dy) < playerSize + 10) {
                collectCrystal(id, c.value);
            }
        }
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Камера слідує за гравцем
        ctx.save();
        ctx.translate(canvas.width / 2 - myData.x, canvas.height / 2 - myData.y);

        // Малюємо сітку світу
        ctx.strokeStyle = "rgba(255, 157, 0, 0.1)";
        ctx.lineWidth = 1;
        for(let i = -2000; i <= 2000; i+=100) {
            ctx.beginPath(); ctx.moveTo(i, -2000); ctx.lineTo(i, 2000); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-2000, i); ctx.lineTo(2000, i); ctx.stroke();
        }

        // Малюємо кристали (лут)
        for(let id in crystals) {
            let c = crystals[id];
            ctx.beginPath();
            ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ff9d00';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff9d00';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Малюємо ІНШИХ гравців
        for(let uid in otherPlayers) {
            if(uid === (user ? user.uid : null)) continue;
            let p = otherPlayers[uid];
            drawPlayer(p.x, p.y, p.color, p.name, p.level);
        }

        // Малюємо СЕБЕ
        if(user) drawPlayer(myData.x, myData.y, myData.color, myData.name, myData.level);

        ctx.restore();
    }

    function drawPlayer(x, y, color, name, level) {
        let size = 20 + (level * 2);
        size = Math.min(size, 60); // Максимальний розмір

        // Тіло гравця
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = color || var(--main);
        ctx.shadowBlur = 20;
        ctx.shadowColor = color || var(--main);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Нікнейм та рівень
        ctx.font = "14px Orbitron";
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.fillText(`${name} [Lv.${level}]`, x, y - size - 10);
    }

    // --- МЕРЕЖЕВИЙ КОД (Firebase) ---
    let lastSyncX = 0, lastSyncY = 0;

    function startNetworkSync() {
        // Відправляємо свої координати кожні 100мс, якщо ми зрушили з місця
        setInterval(() => {
            if(Math.abs(myData.x - lastSyncX) > 2 || Math.abs(myData.y - lastSyncY) > 2) {
                db.ref('world/players/' + user.uid).set({
                    x: Math.round(myData.x), y: Math.round(myData.y),
                    color: myData.color, name: myData.name, level: myData.level
                });
                lastSyncX = myData.x; lastSyncY = myData.y;
            }
        }, 100);

        // Слухаємо інших гравців
        db.ref('world/players').on('value', snap => {
            otherPlayers = snap.val() || {};
        });

        // Слухаємо кристали
        db.ref('world/crystals').on('value', snap => {
            crystals = snap.val() || {};
        });

        // Адмін-спавнер кристалів (якщо кристалів мало - генеруємо)
        setInterval(() => {
            if(Object.keys(crystals).length < 30) {
                spawnCrystal();
            }
        }, 3000);
    }

    function spawnCrystal() {
        let cx = Math.random() * 4000 - 2000;
        let cy = Math.random() * 4000 - 2000;
        db.ref('world/crystals').push({ x: cx, y: cy, value: Math.floor(Math.random()*15)+5 });
    }

    function collectCrystal(id, value) {
        delete crystals[id]; // Видаляємо локально для плавності
        db.ref('world/crystals/' + id).remove(); // Видаляємо з бази
        db.ref('users/' + user.uid + '/balance').set(myData.balance + value);
    }

</script>
</body>
</html>
