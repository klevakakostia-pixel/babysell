<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ROBLOX - Crossplatform Engine</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800;900&display=swap');
        
        :root {
            --rbx-bg: #191B1D;
            --rbx-card: #232527;
            --rbx-hover: #393B3D;
            --rbx-green: #00B251;
            --rbx-green-hover: #00D661;
            --rbx-blue: #00A2FF;
            --rbx-red: #F24747;
            --rbx-topbar: rgba(15, 15, 15, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; user-select: none; font-family: 'Hanken Grotesk', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--rbx-bg); color: #fff; touch-action: none; }

        .screen { position: absolute; inset: 0; display: none; flex-direction: column; opacity: 0; transition: opacity 0.25s ease; }
        .screen.active { display: flex; opacity: 1; }

        /* Кнопки */
        .rbx-btn {
            background: var(--rbx-card); border: 1px solid rgba(255,255,255,0.12); color: #fff;
            padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 15px;
            cursor: pointer; transition: 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        }
        .rbx-btn:hover { background: var(--rbx-hover); }
        .rbx-btn.primary { background: var(--rbx-green); border: none; }
        .rbx-btn.primary:hover { background: var(--rbx-green-hover); }

        /* 1. АВТОРИЗАЦІЯ */
        #login-screen { justify-content: center; align-items: center; z-index: 2000; background: radial-gradient(circle, #2a1b24 0%, #111215 100%); }
        .login-box { background: rgba(35, 37, 39, 0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 40px 30px; text-align: center; width: 90%; max-width: 400px; }
        .rbx-logo { width: 56px; height: 56px; background: #fff; border-radius: 12px; margin: 0 auto 20px; transform: rotate(-9deg); display: flex; align-items: center; justify-content: center; }
        .rbx-logo::after { content: ''; width: 20px; height: 20px; background: var(--rbx-bg); }

        /* 2. МЕНЮ (LOBBY) */
        #home-screen { z-index: 1000; flex-direction: row; }
        .sidebar { width: 70px; background: var(--rbx-card); border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; }
        .lobby-main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .lobby-header { height: 60px; padding: 0 25px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(25,27,29,0.9); }
        .lobby-body { padding: 25px; display: flex; flex-direction: column; gap: 25px; }

        /* 3. 3D СВІТ & UI */
        #game-screen { background: #000; z-index: 3000; }
        
        .rbx-topbar {
            position: absolute; top: 0; left: 0; right: 0; height: 46px;
            background: var(--rbx-topbar); backdrop-filter: blur(10px);
            z-index: 500; display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
        }
        .rbx-icon-btn { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .rbx-icon-btn:hover { background: rgba(255,255,255,0.15); }

        /* Leaderboard */
        .rbx-leaderboard {
            position: absolute; top: 54px; right: 14px; background: rgba(25, 27, 29, 0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; width: 200px; padding: 8px; z-index: 400;
        }
        .lb-player { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); margin-bottom: 4px; font-size: 12px; font-weight: 700; }

        /* ESC Menu */
        #esc-menu {
            position: absolute; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px);
            z-index: 2000; display: none; align-items: center; justify-content: center;
        }
        #esc-menu.active { display: flex; }
        .esc-box { background: var(--rbx-card); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; width: 320px; padding: 25px; display: flex; flex-direction: column; gap: 12px; }

        /* МОБІЛЬНЕ КЕРУВАННЯ (З'ЯВЛЯЄТЬСЯ ТІЛЬКИ НА ТЕЛЕФОНІ) */
        .mobile-ui { display: none; }
        body.is-mobile .mobile-ui { display: block; }
        
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%; z-index: 1000; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.9); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #jump-btn {
            position: absolute; bottom: 40px; right: 35px; width: 80px; height: 80px;
            background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%; z-index: 1000; display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }
        #jump-btn:active { background: rgba(255,255,255,0.3); }

        /* ПІДКАЗКИ ДЛЯ ПК */
        .pc-controls-hint {
            position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.6);
            padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; color: #ccc; z-index: 400;
        }
        body.is-mobile .pc-controls-hint { display: none; }

        #loading-screen { justify-content: center; align-items: center; background: #111215; z-index: 5000; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--rbx-blue); border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="login-screen" class="screen active">
    <div class="login-box">
        <div class="rbx-logo"></div>
        <h1 style="font-size: 22px; font-weight: 900; margin-bottom: 5px;">ROBLOX STUDIO</h1>
        <p style="color: #8a8d9b; font-size: 13px; margin-bottom: 25px;" id="device-label">Detecting device...</p>
        <button class="rbx-btn primary" onclick="loginWithGoogle()" style="width: 100%;">Увійти через Google</button>
    </div>
</div>

<div id="home-screen" class="screen">
    <div class="sidebar">
        <div class="rbx-logo" style="width: 36px; height: 36px; margin: 0;"></div>
    </div>
    <div class="lobby-main">
        <div class="lobby-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="ui-avatar" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--rbx-blue);">
                <span id="ui-name" style="font-weight: 800;">Player</span>
            </div>
            <button class="rbx-btn" onclick="logout()" style="padding: 6px 12px; font-size: 12px; color: var(--rbx-red);">Вийти</button>
        </div>
        <div class="lobby-body">
            <div style="background: var(--rbx-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 20px;">
                <h2 style="font-size: 20px; font-weight: 900; margin-bottom: 10px;">🌅 Sunset Baseplate</h2>
                <p style="color: #8a8d9b; font-size: 13px; margin-bottom: 20px;">Онлайн гравців: <strong id="online-count" style="color: var(--rbx-green);">0</strong></p>
                <button class="rbx-btn primary" onclick="joinServer()" style="width: 100%; height: 46px; font-size: 16px;">ГРАТИ</button>
            </div>
        </div>
    </div>
</div>

<div id="loading-screen" class="screen">
    <div class="spinner"></div>
    <div style="margin-top: 20px; font-weight: 800; font-size: 14px;">ЗАВАНТАЖЕННЯ СВІТУ...</div>
</div>

<div id="game-screen" class="screen">
    <div class="rbx-topbar">
        <div class="rbx-icon-btn" onclick="toggleEscMenu()">
            <div class="rbx-logo" style="width: 20px; height: 20px; margin: 0; border-radius: 4px;"></div>
        </div>
        <div style="font-weight: 800; font-size: 13px; color: #8a8d9b;">ROBLOX ENGINE</div>
    </div>

    <div class="rbx-leaderboard">
        <div style="font-size: 10px; font-weight: 800; color: #8a8d9b; text-transform: uppercase; margin-bottom: 6px;">Гравці</div>
        <div id="leaderboard-players"></div>
    </div>

    <div class="pc-controls-hint">
        WASD - Ходьба | Пробіл - Стрибок | Мишка - Огляд
    </div>

    <!-- Мобільні елементи -->
    <div class="mobile-ui">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="jump-btn">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="#fff"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
        </div>
    </div>

    <div id="esc-menu">
        <div class="esc-box">
            <h3 style="text-align: center; font-weight: 900;">МЕНЮ</h3>
            <button class="rbx-btn primary" onclick="toggleEscMenu()">Продовжити</button>
            <button class="rbx-btn" onclick="resetCharacter()">Заспавнитись</button>
            <button class="rbx-btn" onclick="leaveGame()" style="background: var(--rbx-red); border: none;">Вийти</button>
        </div>
    </div>
</div>

<script>
    // --- 1. АВТО-ВИЗНАЧЕННЯ ПРИСТРОЮ ---
    const isMobileDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.innerWidth < 768;
    if (isMobileDevice) {
        document.body.classList.add('is-mobile');
        document.getElementById('device-label').innerText = "Мобільний режим (Touch UI)";
    } else {
        document.body.classList.remove('is-mobile');
        document.getElementById('device-label').innerText = "ПК режим (Keyboard & Mouse)";
    }

    // --- 2. FIREBASE CONFIG ---
    const firebaseConfig = { 
        apiKey: "AIzaSyB-vHc4nWntJQwf-Ezd6QH5ChXldCkiYBM", 
        authDomain: "babysell-8b37b.firebaseapp.com", 
        databaseURL: "https://babysell-8b37b-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "babysell-8b37b" 
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myColor = '#' + Math.floor(Math.random()*16777215).toString(16);
    let isIngame = false;
    let heartbeatTimer = null;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function loginWithGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message)); }
    function logout() { leaveGame(); auth.signOut().then(() => showScreen('login-screen')); }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('ui-name').innerText = user.displayName.split(' ')[0];
            document.getElementById('ui-avatar').src = user.photoURL;
            showScreen('home-screen');
        } else {
            showScreen('login-screen');
        }
    });

    // Очищення офлайн-гравців
    db.ref('places/empty/players').on('value', snap => {
        const players = snap.val() || {};
        const now = Date.now();
        let count = 0;
        const lb = document.getElementById('leaderboard-players');
        lb.innerHTML = '';

        for(let id in players) {
            const p = players[id];
            if(p.lastSeen && (now - p.lastSeen > 3500)) {
                db.ref('places/empty/players/' + id).remove();
                continue;
            }
            count++;
            lb.innerHTML += `<div class="lb-player"><span>${p.name}</span></div>`;
        }
        document.getElementById('online-count').innerText = count;
    });

    function joinServer() {
        showScreen('loading-screen');
        setTimeout(() => {
            isIngame = true;
            showScreen('game-screen');
            if(!scene) init3DGame();
            resetCharacter();

            const pRef = db.ref('places/empty/players/' + currentUser.uid);
            pRef.onDisconnect().remove();

            clearInterval(heartbeatTimer);
            heartbeatTimer = setInterval(() => {
                if(isIngame && currentUser) {
                    pRef.update({ lastSeen: Date.now(), name: currentUser.displayName.split(' ')[0] });
                }
            }, 1500);
        }, 600);
    }

    function leaveGame() {
        isIngame = false;
        clearInterval(heartbeatTimer);
        if(currentUser) db.ref('places/empty/players/' + currentUser.uid).remove();
        showScreen('home-screen');
    }

    function resetCharacter() {
        if(playerGroup) { playerGroup.position.set(0, 15, 0); velocityY = 0; }
        if(document.getElementById('esc-menu').classList.contains('active')) toggleEscMenu();
    }

    function toggleEscMenu() { document.getElementById('esc-menu').classList.toggle('active'); }

    // --- 3. THREE.JS ДВИГУН ТА КЕРУВАННЯ ---
    let scene, camera, renderer, playerObj, playerGroup;
    let otherPlayers = {};
    let keys = { w:false, a:false, s:false, d:false, space:false };
    let joyVector = { x: 0, y: 0 };
    let cameraYaw = 0, cameraPitch = 0.3;
    let velocityY = 0, gravity = -0.016, moveSpeed = 0.25;

    function createAvatar(colorHex, nameText) {
        const group = new THREE.Group();
        const mat = new THREE.MeshLambertMaterial({ color: colorHex });
        const skin = new THREE.MeshLambertMaterial({ color: 0xffcc99 });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2, 0.8), mat); torso.position.y = 2; group.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), skin); head.position.y = 3.6; group.add(head);
        const lA = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2, 0.7), mat); lA.position.set(-1.2, 2, 0); group.add(lA);
        const rA = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2, 0.7), mat); rA.position.set(1.2, 2, 0); group.add(rA);
        const lL = new THREE.Mesh(new THREE.BoxGeometry(0.75, 2, 0.75), mat); lL.position.set(-0.4, 0, 0); group.add(lL);
        const rL = new THREE.Mesh(new THREE.BoxGeometry(0.75, 2, 0.75), mat); rL.position.set(0.4, 0, 0); group.add(rL);

        return {
            group, lA, rA, lL, rL, torso, head,
            animate: function(t, isM, inAir) {
                if(inAir) {
                    this.lL.rotation.x = -0.6; this.rL.rotation.x = 0.4;
                    this.lA.rotation.x = -2.2; this.rA.rotation.x = -2.2;
                } else if(isM) {
                    const c = Math.sin(t * 13);
                    this.lA.rotation.x = c; this.rA.rotation.x = -c;
                    this.lL.rotation.x = -c; this.rL.rotation.x = c;
                } else {
                    this.lA.rotation.x = 0; this.rA.rotation.x = 0;
                    this.lL.rotation.x = 0; this.rL.rotation.x = 0;
                }
            }
        };
    }

    function init3DGame() {
        const container = document.getElementById('game-screen');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xff6b4a);
        scene.fog = new THREE.FogExp2(0xff6b4a, 0.012);

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x705060, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffb07c, 1.4);
        dirLight.position.set(-50, 40, -50); dirLight.castShadow = true;
        scene.add(dirLight);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x1e1619 }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(300, 60, 0xff2a5f, 0xff2a5f);
        grid.material.opacity = 0.2; grid.material.transparent = true;
        scene.add(grid);

        playerObj = createAvatar(myColor, currentUser.displayName.split(' ')[0]);
        playerGroup = playerObj.group;
        scene.add(playerGroup);

        setupInputHandlers();
        setupMultiplayer();
        animate();
    }

    // НАЛАШТУВАННЯ КЕРУВАННЯ З ЧІТКИМ РОЗДІЛЕННЯМ ДЕЛЕГОВАНИХ ПОДІЙ
    function setupInputHandlers() {
        // --- ПК: КЛАВІАТУРА ТА МИШКА ---
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'ц') keys.w = true;
            if(k === 's' || k === 'і') keys.s = true;
            if(k === 'a' || k === 'ф') keys.a = true;
            if(k === 'd' || k === 'в') keys.d = true;
            if(e.key === ' ') keys.space = true;
            if(e.key === 'Escape') toggleEscMenu();
        });

        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'ц') keys.w = false;
            if(k === 's' || k === 'і') keys.s = false;
            if(k === 'a' || k === 'ф') keys.a = false;
            if(k === 'd' || k === 'в') keys.d = false;
            if(e.key === ' ') keys.space = false;
        });

        let isMouseDown = false, lastMX = 0, lastMY = 0;
        window.addEventListener('mousedown', e => {
            if(!isMobileDevice && isIngame && e.target.tagName === 'CANVAS') {
                isMouseDown = true; lastMX = e.clientX; lastMY = e.clientY;
            }
        });
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', e => {
            if(isMouseDown && !isMobileDevice) {
                cameraYaw -= (e.clientX - lastMX) * 0.005;
                cameraPitch = Math.max(0.05, Math.min(1.3, cameraPitch + (e.clientY - lastMY) * 0.005));
                lastMX = e.clientX; lastMY = e.clientY;
            }
        });

        // --- МОБІЛЬНІ: ТАЧ-СЕНСОР ТА ДЖОЙСТИК ---
        if(isMobileDevice) {
            const joyZone = document.getElementById('joystick-zone');
            const joyKnob = document.getElementById('joystick-knob');
            const jumpBtn = document.getElementById('jump-btn');

            let joyTouchId = null;
            let joyCenterX = 0, joyCenterY = 0;

            joyZone.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.changedTouches[0];
                joyTouchId = t.identifier;
                const r = joyZone.getBoundingClientRect();
                joyCenterX = r.left + r.width / 2;
                joyCenterY = r.top + r.height / 2;
                updateJoystick(t);
            }, { passive: false });

            window.addEventListener('touchmove', e => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if(t.identifier === joyTouchId) {
                        updateJoystick(t);
                    }
                }
            }, { passive: false });

            const endJoystick = (e) => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === joyTouchId) {
                        joyTouchId = null;
                        joyKnob.style.transform = `translate(0px, 0px)`;
                        joyVector = { x: 0, y: 0 };
                    }
                }
            };
            window.addEventListener('touchend', endJoystick);
            window.addEventListener('touchcancel', endJoystick);

            function updateJoystick(t) {
                let dx = t.clientX - joyCenterX;
                let dy = t.clientY - joyCenterY;
                const maxDist = 40;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVector.x = dx / maxDist;
                joyVector.y = dy / maxDist;
            }

            // Кнопка стрибка
            jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.space = true; }, { passive: false });
            jumpBtn.addEventListener('touchend', e => { e.preventDefault(); keys.space = false; }, { passive: false });

            // Обертання камери пальцем по екрану
            let camTouchId = null, lastTX = 0, lastTY = 0;
            window.addEventListener('touchstart', e => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    // Якщо тач не на джойстику і не на кнопці стрибка — це обертання камери
                    if(t.identifier !== joyTouchId && !e.target.closest('#jump-btn') && !e.target.closest('#joystick-zone')) {
                        camTouchId = t.identifier;
                        lastTX = t.clientX; lastTY = t.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', e => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if(t.identifier === camTouchId) {
                        cameraYaw -= (t.clientX - lastTX) * 0.007;
                        cameraPitch = Math.max(0.05, Math.min(1.3, cameraPitch + (t.clientY - lastTY) * 0.007));
                        lastTX = t.clientX; lastTY = t.clientY;
                    }
                }
            });

            const endCamTouch = (e) => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === camTouchId) camTouchId = null;
                }
            };
            window.addEventListener('touchend', endCamTouch);
            window.addEventListener('touchcancel', endCamTouch);
        }
    }

    function setupMultiplayer() {
        db.ref('places/empty/players').on('value', snap => {
            const players = snap.val() || {};
            for(let uid in players) {
                if(uid === currentUser.uid) continue;
                const d = players[uid];
                if(!otherPlayers[uid]) {
                    const av = createAvatar(d.color || '#fff', d.name);
                    scene.add(av.group);
                    otherPlayers[uid] = { avatar: av, tx: d.x, ty: d.y, tz: d.z, try: d.ry, isM: false, inAir: false };
                }
                const op = otherPlayers[uid];
                op.tx = d.x; op.ty = d.y; op.tz = d.z; op.try = d.ry; op.isM = d.isM; op.inAir = d.inAir;
            }
            for(let uid in otherPlayers) {
                if(!players[uid]) { scene.remove(otherPlayers[uid].avatar.group); delete otherPlayers[uid]; }
            }
        });
    }

    function animate(time) {
        requestAnimationFrame(animate);
        if(!isIngame) return;

        let inputX = 0, inputZ = 0;

        // Векторний вхід в залежності від типу пристрою
        if(isMobileDevice) {
            inputX = joyVector.x;
            inputZ = joyVector.y;
        } else {
            if(keys.w) inputZ -= 1; if(keys.s) inputZ += 1;
            if(keys.a) inputX -= 1; if(keys.d) inputX += 1;
        }

        const isMoving = Math.abs(inputX) > 0.1 || Math.abs(inputZ) > 0.1;

        if(isMoving) {
            const moveAngle = Math.atan2(inputX, inputZ) + cameraYaw;
            playerGroup.position.x += Math.sin(moveAngle) * moveSpeed;
            playerGroup.position.z += Math.cos(moveAngle) * moveSpeed;
            playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, moveAngle, 0.25);
        }

        // Фізика стрибків
        velocityY += gravity;
        playerGroup.position.y += velocityY;
        let inAir = false;

        if(playerGroup.position.y <= 1) {
            playerGroup.position.y = 1; velocityY = 0;
            if(keys.space) velocityY = 0.4;
        } else {
            inAir = true;
        }

        playerObj.animate(time * 0.001, isMoving, inAir);

        // Синхронізація позиції
        if(currentUser) {
            db.ref('places/empty/players/' + currentUser.uid).update({
                x: playerGroup.position.x, y: playerGroup.position.y, z: playerGroup.position.z,
                ry: playerGroup.rotation.y, isM: isMoving, inAir: inAir
            });
        }

        // Інтерполяція інших гравців
        for(let uid in otherPlayers) {
            const op = otherPlayers[uid];
            op.avatar.group.position.lerp(new THREE.Vector3(op.tx, op.ty, op.tz), 0.25);
            op.avatar.group.rotation.y = THREE.MathUtils.lerp(op.avatar.group.rotation.y, op.try, 0.25);
            op.avatar.animate(time * 0.001, op.isM, op.inAir);
        }

        // Камера від 3-ї особи
        const camDist = 14;
        const tx = playerGroup.position.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * camDist;
        const ty = playerGroup.position.y + Math.sin(cameraPitch) * camDist + 1.2;
        const tz = playerGroup.position.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * camDist;
        camera.position.lerp(new THREE.Vector3(tx, ty, tz), 0.2);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        if(camera && renderer) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    });
</script>
